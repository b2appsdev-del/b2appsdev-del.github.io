<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modular Streamer OBS Overlay</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; width:1920px; height:1080px; overflow:hidden; position:relative; }
    .top-bar { position: absolute; top: 20px; left: 30px; display: flex; gap: 20px; background: rgba(15, 23, 42, 0.85); padding: 12px 24px; border-radius: 10px; border: 1px solid #334155; backdrop-filter: blur(8px); }
    .bar-item { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .bar-val { color: #38bdf8; font-weight: bold; margin-left: 6px; }
    .goal-box { position: absolute; bottom: 30px; left: 30px; width: 380px; background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; border-radius: 8px; padding: 14px; }
    .goal-title { font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    .goal-track { height: 12px; background: #334155; border-radius: 6px; overflow: hidden; }
    .goal-fill { height: 100%; width: 72%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 6px; }
    .alert-popup { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #0284c7, #6366f1); padding: 24px 48px; border-radius: 16px; text-align: center; font-size: 26px; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: bounce 1s infinite alternate; }
    @keyframes bounce { 0% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(1.04); } }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="bar-item">LATEST FOLLOWER: <span class="bar-val">Alex_V</span></div>
    <div class="bar-item">RECENT TIP: <span class="bar-val">$15.00 (Crypto)</span></div>
    <div class="bar-item">SUB GOAL: <span class="bar-val">72 / 100</span></div>
  </div>

  <div class="goal-box">
    <div class="goal-title">Community Goal (72%)</div>
    <div class="goal-track"><div class="goal-fill"></div></div>
  </div>

  <div class="alert-popup">
    🎉 NEW SUBSCRIBER: @CryptoDev
  </div>
</body>
</html>
