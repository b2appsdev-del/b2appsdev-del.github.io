<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Pub Quiz & Multi-Round Trivia Master Kit</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #18181b; color: #f4f4f5; padding: 24px; max-width: 900px; margin: 0 auto; }
    h1 { color: #f59e0b; font-size: 26px; }
    .card { background: #27272a; border: 1px solid #3f3f46; border-radius: 8px; padding: 20px; margin-top: 20px; }
    .round-btn { background: #3f3f46; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; margin-right: 8px; cursor: pointer; font-weight: bold; }
    .round-btn.active { background: #f59e0b; color: #000; }
    .question-box { margin: 15px 0; padding: 15px; background: #18181b; border-radius: 6px; }
    .ans-btn { background: #0284c7; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; margin-top:8px; }
  </style>
</head>
<body>
  <h1>🍻 Interactive Pub Quiz & Trivia Master Engine</h1>
  <p style="color:#a1a1aa;">5 Complete Turnkey Trivia Rounds with Host Answers & Scoring Sheets.</p>

  <div class="card">
    <button class="round-btn active" onclick="loadRound(1)">Round 1: General Knowledge</button>
    <button class="round-btn" onclick="loadRound(2)">Round 2: Tech & Science</button>
    <button class="round-btn" onclick="loadRound(3)">Round 3: Movies & Pop Culture</button>
    <button class="round-btn" onclick="loadRound(4)">Round 4: Geography</button>
    <button class="round-btn" onclick="loadRound(5)">Round 5: Lightning Round</button>
    
    <div id="round-content" style="margin-top:20px;"></div>
  </div>

  <script>
    const rounds = {
      1: [
        { q: "What year did the Berlin Wall fall?", a: "1989" },
        { q: "Which artist painted 'The Starry Night'?", a: "Vincent van Gogh" },
        { q: "What is the hardest natural substance on Earth?", a: "Diamond" }
      ],
      2: [
        { q: "What does 'HTTP' stand for?", a: "Hypertext Transfer Protocol" },
        { q: "What is the speed of light in vacuum (approx km/s)?", a: "300,000 km/s (299,792 km/s)" },
        { q: "Who created the Linux kernel in 1991?", a: "Linus Torvalds" }
      ],
      3: [
        { q: "Which 1994 film features the quote: 'Life is like a box of chocolates'?", a: "Forrest Gump" },
        { q: "Who plays Tony Stark in the Marvel Cinematic Universe?", a: "Robert Downey Jr." },
        { q: "What is the highest-grossing animated film of all time?", a: "Inside Out 2 (2024)" }
      ],
      4: [
        { q: "What is the capital city of Australia?", a: "Canberra" },
        { q: "Which river flows through the Grand Canyon?", a: "Colorado River" },
        { q: "What is the smallest country in the world by land area?", a: "Vatican City" }
      ],
      5: [
        { q: "How many valves does a standard trumpet have?", a: "3" },
        { q: "What is the chemical symbol for gold?", a: "Au" },
        { q: "In chess, how many squares are on a standard board?", a: "64" }
      ]
    };

    function loadRound(r) {
      document.querySelectorAll('.round-btn').forEach((b, i) => {
        b.className = (i + 1 === r) ? 'round-btn active' : 'round-btn';
      });
      const data = rounds[r];
      let html = "<h3>Round " + r + "</h3>";
      data.forEach((item, idx) => {
        html += "<div class='question-box'><div style='font-size:16px; font-weight:600;'>Q" + (idx+1) + ": " + item.q + "</div><button class='ans-btn' onclick='this.nextElementSibling.style.display="block"'>Show Answer</button><div style='display:none; color:#10b981; margin-top:8px; font-weight:bold;'>Answer: " + item.a + "</div></div>";
      });
      document.getElementById('round-content').innerHTML = html;
    }
    loadRound(1);
  </script>
</body>
</html>
