name: Free tool page engine

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-pages
  cancel-in-progress: false

env:
  BUILDER_B64: 
  QUEUE_B64: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install builder and curated queue (self-bootstrapping)
        run: |
          set -e
          mkdir -p scripts data
          printf '%s' "$BUILDER_B64" | base64 -d > scripts/auto_pages.py
          printf '%s' "$QUEUE_B64" | base64 -d > data/page-queue.json
          python -m py_compile scripts/auto_pages.py

      - name: Build queued pages
        id: build
        run: |
          set -e
          OUT="$(python scripts/auto_pages.py --all)"
          echo "$OUT"
          URLS="$(printf '%s\n' "$OUT" | grep '^BUILT_URL=' | sed 's/^BUILT_URL=//' | paste -sd, -)"
          if [ -n "$URLS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "urls=$URLS" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit pages, sitemap and hub links
        if: steps.build.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "b2appsdev-del"
          git config user.email "b2appsdev-del@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add free no-signup tool pages (auto-pages engine)"
            git push
          fi

      - name: Ping IndexNow
        if: steps.build.outputs.changed == 'true'
        env:
          PAGE_URLS: ${{ steps.build.outputs.urls }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          key = "6e3b0dea434b4a7098266667d8a75fbf"
          urls = [u for u in os.environ.get("PAGE_URLS", "").split(",") if u]
          if not urls:
              raise SystemExit(0)
          body = json.dumps({
              "host": "b2appsdev-del.github.io",
              "key": key,
              "keyLocation": "https://b2appsdev-del.github.io/%s.txt" % key,
              "urlList": urls,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("IndexNow HTTP", r.status, "for", len(urls), "url(s)")
          except Exception as exc:
              print("IndexNow ping failed (non-fatal):", exc)
          PY
