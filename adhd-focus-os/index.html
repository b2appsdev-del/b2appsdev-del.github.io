<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADHD Low-Friction Focus System</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #e4e4e7; padding: 24px; max-width: 700px; margin: 0 auto; }
    h1 { color: #a1a1aa; font-size: 20px; font-weight: 500; }
    .timer-circle { width: 180px; height: 180px; border-radius: 50%; border: 4px solid #27272a; border-top-color: #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 36px; font-family: monospace; font-weight: bold; margin: 30px auto; }
    .btn { background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin: 4px; }
    .btn:hover { background: #3f3f46; }
    textarea { width: 100%; height: 120px; background: #18181b; border: 1px solid #27272a; color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; margin-top: 15px; outline: none; }
  </style>
</head>
<body>
  <h1>🧠 Minimalist Focus System (Low Friction)</h1>
  
  <div class="timer-circle" id="timer">25:00</div>
  
  <div style="text-align:center;">
    <button class="btn" onclick="startTimer()">Start 25m Sprint</button>
    <button class="btn" onclick="resetTimer()">Reset</button>
  </div>

  <div style="margin-top:30px;">
    <h3 style="font-size:14px; color:#a1a1aa;">DOPAMINE DUMP (Write thoughts here, don't switch tabs):</h3>
    <textarea placeholder="Write any distracting thought or idea here to review later..."></textarea>
  </div>

  <script>
    let sec = 1500;
    let timerId = null;
    function updateDisplay() {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = m + ':' + s;
    }
    function startTimer() {
      if (timerId) return;
      timerId = setInterval(() => {
        if (sec > 0) { sec--; updateDisplay(); }
        else { clearInterval(timerId); alert('Time up! Take a break.'); }
      }, 1000);
    }
    function resetTimer() {
      clearInterval(timerId);
      timerId = null;
      sec = 1500;
      updateDisplay();
    }
  </script>
</body>
</html>
